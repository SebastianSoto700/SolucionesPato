<app-navbar></app-navbar>

<main class="pt-24">
  <!-- Catálogo -->
  <section class="bg-gray-50 py-16">
    <div class="container mx-auto px-4">
      <h2 class="text-3xl font-bold text-center text-blue-900 mb-12">Catálogo</h2>
      
      <div class="grid md:grid-cols-3 gap-8">
        <div *ngFor="let p of productos" 
             class="bg-white rounded-2xl shadow-md hover:shadow-lg transition p-4">
          
          <img [src]="p.imagen" [alt]="p.nombre" 
               class="w-full h-48 object-cover rounded-xl mb-4">
          
          <h3 class="text-xl font-semibold text-blue-800 mb-2">{{ p.nombre }}</h3>
          <p class="text-gray-600 text-sm mb-3">{{ p.descripcion }}</p>
          <p class="font-bold text-blue-900 mb-4">{{ p.precio }}</p>
          
          <button (click)="cotizar(p)" 
                  class="bg-blue-900 text-white px-4 py-2 rounded-xl hover:bg-blue-800 transition">
            Cotizar
          </button>
        </div>
      </div>
    </div>
  </section>
</main>

<app-footer></app-footer>
