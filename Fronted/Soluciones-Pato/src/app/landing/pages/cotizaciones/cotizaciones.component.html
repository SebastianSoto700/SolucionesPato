<app-navbar></app-navbar>

<main class=""> <!-- Compensa el navbar fijo -->
  <section class="bg-gray-50 py-16">
    <div class="container mx-auto px-4 max-w-xl bg-white shadow-lg rounded-2xl p-8">
      <h2 class="text-2xl font-bold text-blue-900 mb-6">Cotización</h2>
      
      <!-- Mostrar producto que vino del catálogo -->
      <p *ngIf="productoSeleccionado" class="mb-4 text-gray-700">
        Producto/Servicio: <span class="font-semibold">{{ productoSeleccionado }}</span>
      </p>
      
      <!-- Formulario -->
      <form (ngSubmit)="enviarWhatsApp()" class="space-y-4">
        <input type="text" [(ngModel)]="nombre" name="nombre" placeholder="Tu nombre"
               class="w-full border p-3 rounded-xl" required>

        <input type="email" [(ngModel)]="email" name="email" placeholder="Tu correo"
               class="w-full border p-3 rounded-xl" required>

        <input type="tel" [(ngModel)]="telefono" name="telefono" placeholder="Tu teléfono"
               class="w-full border p-3 rounded-xl" required>

        <textarea [(ngModel)]="mensaje" name="mensaje" rows="3" placeholder="Mensaje adicional"
                  class="w-full border p-3 rounded-xl"></textarea>
        
        <button type="submit"
                class="w-full bg-blue-900 text-white py-3 rounded-xl hover:bg-blue-800 transition">
          Enviar por WhatsApp
        </button>
      </form>
    </div>
  </section>
</main>

<app-footer></app-footer>
