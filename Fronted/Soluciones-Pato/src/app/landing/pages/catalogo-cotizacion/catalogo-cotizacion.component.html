<app-navbar></app-navbar>
    <div class="relative h-[30vh] flex items-center justify-center text-center text-white bg-bg-brand w-full"> 
        <h2 class="text-3xl font-bold text-white mb-10 text-center">Catálogo</h2>
    </div>
<main class="bg-gray-50 min-h-screen">
  <!-- Catálogo -->
  <section *ngIf="!productoSeleccionado">    
    <div class="container mx-auto grid md:grid-cols-4 gap-8 px-4 py-8">
      <div *ngFor="let p of productos"
           class="bg-white rounded-2xl shadow-md hover:shadow-lg transition p-2 flex flex-col items-center">
        <img [src]="'http://localhost:1218/uploads/productos/' + p.imagen" [alt]="p.nombre" 
             class="w-full h-60 object-cover rounded-xl mb-4 border border-blue-100">
        <h3 class="text-xl font-semibold text-blue-800 mb-2">{{ p.nombre }}</h3>
        <p class="text-gray-600 text-sm mb-3 text-center">{{ p.descripcion }}</p>
        <p class="font-bold text-blue-900 mb-4">{{ p.precio }}</p>
        <button (click)="verDetalle(p)"
                class="bg-blue-900 text-white w-full px-4 py-2 rounded-xl hover:bg-blue-800 transition">
          Ver detalle
        </button>
      </div>
    </div>
  </section>

  <!-- Detalle y formulario -->
  <section *ngIf="productoSeleccionado" class="container mx-auto max-w-xl px-4 pt-8 pb-16">
    
    <div class="bg-white shadow-lg rounded-2xl p-8 ">
      <img [src]="'http://localhost:1218/uploads/productos/' + productoSeleccionado.imagen" [alt]="productoSeleccionado.nombre"
     class="w-full h-40 object-cover rounded-xl mb-4 border border-blue-100">
      <h2 class="text-2xl font-bold text-blue-900 mb-2">{{ productoSeleccionado.nombre }}</h2>
      <p class="text-gray-700 mb-4">{{ productoSeleccionado.descripcion }}</p>
      <p class="font-bold text-blue-900 mb-6">{{ productoSeleccionado.precio }}</p>
      <div class="flex flex-col md:flex-row gap-4 mb-6">
        <button (click)="cotizar()"
                class="flex-1 bg-blue-900 text-white py-3 rounded-xl hover:bg-blue-800 transition">
          Cotizar
        </button>
        <button (click)="productoSeleccionado = null"
                class="flex-1 bg-gray-100 text-blue-900 py-3 rounded-xl hover:bg-blue-50 transition border border-blue-100">
          ← Volver al catálogo
        </button>
      </div>

      <!-- Formulario -->
      <form *ngIf="mostrarFormulario" (ngSubmit)="enviarWhatsApp()" class="space-y-4 mt-4">
        <input type="text" [(ngModel)]="nombre" name="nombre" placeholder="Tu nombre"
               class="w-full border border-blue-200 p-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-800" required>
        <input type="email" [(ngModel)]="email" name="email" placeholder="Tu correo"
               class="w-full border border-blue-200 p-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-800" required>
        <input type="tel" [(ngModel)]="telefono" name="telefono" placeholder="Tu teléfono"
               class="w-full border border-blue-200 p-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-800" required>
        <textarea [(ngModel)]="mensaje" name="mensaje" rows="3" placeholder="Mensaje adicional"
                  class="w-full border border-blue-200 p-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-800"></textarea>
        <button type="submit"
                class="w-full bg-blue-900 text-white py-3 rounded-xl hover:bg-blue-800 transition font-semibold">
          Enviar por WhatsApp
        </button>
      </form>
    </div>
  </section>
</main>
<app-footer></app-footer>
